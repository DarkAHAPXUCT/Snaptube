<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snaptube Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        body { background-color: #f2f2f6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .main-wrapper { flex: 1; position: relative; overflow: hidden; }
        .app-screen { display: flex; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background-color: #ffffff; overflow-y: auto; }
        .bg-watermarks { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 80px 5px; }
        .bg-row { display: flex; justify-content: space-between; width: 100%; }
        .watermark { fill: #f7f7f7; width: 120px; height: 120px; }
        .wm-yt-top-left { transform: rotate(-15deg); }
        .wm-tiktok-top-right { transform: rotate(15deg); }
        .wm-tiktok-bottom-left { transform: rotate(-15deg); }
        .wm-yt-bottom-right { transform: rotate(15deg); }
        .ui-layer { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
        .top-nav { display: flex; justify-content: space-around; align-items: center; padding: 50px 15px 15px 15px; }
        .tab { font-size: 15px; color: #999999; font-weight: 500; cursor: pointer; padding-bottom: 8px; position: relative;}
        .tab.active { color: #111111; font-weight: 700; }
        .tab.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background-color: #FDD835; border-radius: 2px; }
        .main-content { flex: 1; position: relative; }
        .logo { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 44px; font-weight: 800; color: #FDD835; letter-spacing: -1px; }
        .search-bar { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 88%; height: 64px; border: 1.5px solid #d4d4d4; border-radius: 32px; display: flex; align-items: center; padding: 0 15px 0 20px; background-color: #ffffff; }
        .icon-download { width: 20px; height: 20px; margin-right: 14px; stroke: #999999; stroke-width: 1.5; fill: none; }
        .search-input { flex: 1; border: none; outline: none; background: transparent; font-size: 16px; color: #444444; }
        .mic-button { background: none; border: none; display: flex; align-items: center; cursor: pointer; }
        .icon-mic { width: 22px; height: 22px; stroke: #999999; stroke-width: 1.8; fill: none; }
        .bottom-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px 25px 25px; border-top: 1px solid #F0F0F0; background-color: #ffffff; z-index: 10; flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #999999; cursor: pointer; background: none; border: none; }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 6px; stroke: #999999; stroke-width: 1.5; fill: none; }
        .nav-item span { font-size: 11px; font-weight: 400; }
        .nav-item.active { color: #111111; }
        .nav-item.active svg { stroke: #111111; stroke-width: 2.2; }
        .nav-item.active span { font-weight: 700; font-size: 12px; }
    </style>
<style> .top-nav { padding-top: 40px !important; } .logo { top: 22% !important; } .search-bar { top: 38% !important; } </style><style> .top-nav { padding-top: 40px !important; } .logo { top: 22% !important; } .search-bar { top: 40% !important; } </style><style> .top-nav { padding-top: 50px !important; } .search-bar { top: 36% !important; } </style><script> function switchTopTab(id, el) { document.querySelectorAll(".tab").forEach(t => t.classList.remove("active")); el.classList.add("active"); document.querySelectorAll(".app-screen").forEach(s => s.classList.remove("active")); document.getElementById(id).classList.add("active"); } function switchBottomTab(id, el) { document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active")); el.classList.add("active"); document.querySelectorAll(".app-screen").forEach(s => s.classList.remove("active")); document.getElementById(id).classList.add("active"); } </script></head>
<body>
    <div class="main-wrapper">
        <div class="app-screen">
            <div class="bg-watermarks">
                <div class="bg-row">
                    <svg class="watermark wm-yt-top-left" viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.9-1.53-1.76-1.76C18.25 5 12 5 12 5s-6.25 0-7.82.43c-.86.23-1.53.9-1.76 1.76C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.9 1.53 1.76 1.76C5.75 19 12 19 12 19s6.25 0 7.82-.43c.86-.23 1.53-.9 1.76-1.76C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
                    <svg class="watermark wm-tiktok-top-right" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
                </div>
                <div class="bg-row">
                    <svg class="watermark wm-tiktok-bottom-left" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
                    <svg class="watermark wm-yt-bottom-right" viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.9-1.53-1.76-1.76C18.25 5 12 5 12 5s-6.25 0-7.82.43c-.86.23-1.53.9-1.76 1.76C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.9 1.53 1.76 1.76C5.75 19 12 19 12 19s6.25 0 7.82-.43c.86-.23 1.53-.9 1.76-1.76C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
                </div>
            </div>
            <div class="ui-layer">
                <div class="top-nav">
                    <div class="tab active">Поиск</div>
                    <div class="tab">YouTube</div>
                    <div class="tab">Музыка</div>
                </div>
                <div class="main-content">
                    <div class="logo">Snaptube</div>
                    <div class="search-bar">
                        <svg class="icon-download" viewBox="0 0 24 24"><path d="M12 4v9m0 0l-4-4m4 4l4-4M6 18h12" /></svg>
                        <input type="text" class="search-input" placeholder="Поиск">
                        <button class="mic-button"><svg class="icon-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></button>
                    </div>
                </div>
            </div>
            <div class="bottom-nav">
                <button class="nav-item active">
                    <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" /><line x1="14.5" y1="14.5" x2="20" y2="20" /></svg><span>Загрузить</span>
                </button>
                <button class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M4 8v11a1 1 0 0 0 1 1h11" /><rect x="8" y="4" width="12" height="12" rx="1.5" /><polygon points="12,7 16,10 12,13" fill="currentColor" stroke="none" /></svg><span>Воспроизведение</span>
                </button>
                <button class="nav-item">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg><span>Настройки</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
