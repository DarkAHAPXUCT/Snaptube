<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Snaptube Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{background-color:#f2f2f6;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.main-wrapper{flex:1;position:relative;overflow:hidden}
.app-screen{display:none;flex-direction:column;height:100%;width:100%;position:absolute;top:0;left:0;opacity:0;transition:opacity 0.2s ease-in-out;background-color:#ffffff;overflow-y:auto}
.app-screen.active{display:flex;opacity:1}
.bg-watermarks{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:80px 5px}
.bg-row{display:flex;justify-content:space-between;width:100%}
.watermark{fill:#f7f7f7;width:120px;height:120px}
.wm-yt-top-left{transform:rotate(-15deg)}
.wm-tiktok-top-right{transform:rotate(15deg)}
.wm-tiktok-bottom-left{transform:rotate(-15deg)}
.wm-yt-bottom-right{transform:rotate(15deg)}
.ui-layer{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

/* ИЗМЕНЕНИЕ 1: Кнопки опущены (65px) */
.top-nav{display:flex;justify-content:space-around;align-items:center;padding:65px 15px 15px 15px;flex-shrink:0}
.tab{font-size:15px;color:#999;font-weight:500;cursor:pointer;padding-bottom:8px;position:relative}
.tab.active{color:#111;font-weight:700}
.tab.active::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:3px;background-color:#FDD835;border-radius:2px}
.main-content{flex:1;position:relative}

/* ИЗМЕНЕНИЕ 2: Логотип поднят (20%) */
.logo{position:absolute;top:20%;left:50%;transform:translateX(-50%);font-size:44px;font-weight:800;color:#FDD835;letter-spacing:-1px}

/* ИЗМЕНЕНИЕ 3: Поиск поднят (35%), микрофон на месте */
.search-bar{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);width:88%;height:64px;border:1.5px solid #d4d4d4;border-radius:32px;display:flex;align-items:center;padding:0 15px 0 20px;background-color:#fff}

.icon-download{width:20px;height:20px;margin-right:14px;stroke:#999;stroke-width:1.5;fill:none}
.search-input{flex:1;border:none;outline:none;background:transparent;font-size:16px;color:#444}
.mic-button{background:none;border:none;display:flex;align-items:center;cursor:pointer}
.icon-mic{width:22px;height:22px;stroke:#999;stroke-width:1.8;fill:none}
.placeholder-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.placeholder-text{color:#999;font-size:18px}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;padding:15px 25px 25px 25px;border-top:1px solid #F0F0F0;background-color:#fff;z-index:10;flex-shrink:0}
.nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#999;cursor:pointer;background:none;border:none}
.nav-item svg{width:24px;height:24px;margin-bottom:6px;stroke:#999;stroke-width:1.5;fill:none}
.nav-item span{font-size:11px;font-weight:400}
.nav-item.active{color:#111}
.nav-item.active svg{stroke:#111;stroke-width:2.2}
.nav-item.active span{font-weight:700;font-size:12px}
.ghost-icon svg{width:100px;height:100px;fill:none;stroke:#EBEBEB;stroke-width:3;margin-bottom:20px}
.offline-icon{margin-bottom:20px}
.offline-icon svg{width:100px;height:100px;stroke:#EBEBEB;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.offline-title{font-size:20px;color:#333;margin-bottom:10px}
.offline-subtitle{font-size:15px;color:#999;text-align:center;line-height:1.4;margin-bottom:30px}
.retry-btn{background:none;border:none;color:#FDD835;font-size:16px;font-weight:700;text-transform:uppercase;cursor:pointer}
.header-title-white{padding:40px 20px 20px 20px}
.header-title-white h1{font-size:26px;font-weight:800;color:#111}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:60px}
.empty-icon{width:110px;height:110px;border:3px solid #EBEBEB;border-radius:50%;display:flex;justify-content:center;align-items:center;margin-bottom:25px}
.empty-icon svg{width:50px;height:50px;stroke:#EBEBEB;stroke-width:2.5;fill:none}
.empty-text{font-size:17px;color:#999;margin-bottom:35px}
.btn-search-empty{display:flex;align-items:center;gap:10px;background-color:#fff;border:1.5px solid #E0E0E0;border-radius:30px;padding:12px 45px;font-size:17px;font-weight:700;color:#111;cursor:pointer}
.settings-header{padding:40px 20px 20px 20px}
.settings-header h1{font-size:26px;font-weight:800;color:#111}
.settings-section{margin-bottom:25px}
.settings-section-title{font-size:14px;color:#999;padding:0 20px 10px 20px}
.settings-list{background-color:#fff;border-radius:12px;margin:0 15px;overflow:hidden}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.settings-item:last-child{border-bottom:none}
.settings-item-left{display:flex;align-items:center;gap:15px}
.settings-item-icon{width:24px;height:24px;stroke:#999;stroke-width:1.8;fill:none}
.settings-item-text{font-size:17px;color:#111}
.chevron-icon{width:18px;height:18px;stroke:#ccc;stroke-width:2;fill:none}
</style>
</head>
<body>
<div class="main-wrapper">
<div id="screen-search" class="app-screen active">
<div class="bg-watermarks">
<div class="bg-row">
<svg class="watermark wm-yt-top-left" viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.9-1.53-1.76-1.76C18.25 5 12 5 12 5s-6.25 0-7.82.43c-.86.23-1.53.9-1.76 1.76C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.9 1.53 1.76 1.76C5.75 19 12 19 12 19s6.25 0 7.82-.43c.86-.23 1.53-.9 1.76-1.76C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
<svg class="watermark wm-tiktok-top-right" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
</div>
<div class="bg-row">
<svg class="watermark wm-tiktok-bottom-left" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
<svg class="watermark wm-yt-bottom-right" viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.9-1.53-1.76-1.76C18.25 5 12 5 12 5s-6.25 0-7.82.43c-.86.23-1.53.9-1.76 1.76C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.9 1.53 1.76 1.76C5.75 19 12 19 12 19s6.25 0 7.82-.43c.86-.23 1.53-.9 1.76-1.76C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
</div>
</div>
<div class="ui-layer">
<div class="top-nav">
<div class="tab active" onclick="switchTab('search')">Поиск</div>
<div class="tab" onclick="switchTab('youtube')">YouTube</div>
<div class="tab" onclick="switchTab('music')">Музыка</div>
</div>
<div class="main-content">
<div class="logo">Snaptube</div>
<div class="search-bar">
<svg class="icon-download" viewBox="0 0 24 24"><path d="M12 4v9m0 0l-4-4m4 4l4-4M6 18h12"/></svg>
<input type="text" class="search-input" placeholder="Поиск">
<button class="mic-button"><svg class="icon-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></button>
</div>
</div>
<div class="bottom-nav">
<button class="nav-item active" onclick="showScreen('screen-downloaded',this)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span>Загрузить</span></button>
<button class="nav-item" onclick="showScreen('screen-youtube',this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><polygon points="10 8 16 12 10 16 10 8"></polygon></svg><span>Воспроизведение</span></button>
<button class="nav-item" onclick="showScreen('screen-settings',this)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span>Настройки</span></button>
</div>
</div>
</div>

<div id="screen-youtube" class="app-screen">
<div class="top-nav"><div class="tab" onclick="switchTab('search')">Поиск</div><div class="tab active" onclick="switchTab('youtube')">YouTube</div><div class="tab" onclick="switchTab('music')">Музыка</div></div>
<div class="placeholder-screen"><div class="ghost-icon"><svg viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"></path><line x1="9" y1="10" x2="9.01" y2="10"></line><line x1="15" y1="10" x2="15.01" y2="10"></line></svg></div><p class="placeholder-text">Ой! Ничего не найдено.</p></div>
</div>

<div id="screen-music" class="app-screen">
<div class="top-nav"><div class="tab" onclick="switchTab('search')">Поиск</div><div class="tab" onclick="switchTab('youtube')">YouTube</div><div class="tab active" onclick="switchTab('music')">Музыка</div></div>
<div class="placeholder-screen"><div class="offline-icon"><svg viewBox="0 0 24 24"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"></path><circle cx="12" cy="16" r="1" fill="#EBEBEB"></circle><path d="M18 16l4 4M22 16l-4 4" stroke="#EBEBEB" stroke-width="2"></path></svg></div><h2 class="offline-title">Ты офлайн.</h2><p class="offline-subtitle">Проверь подключение к сети и<br>повтори попытку.</p><button class="retry-btn">ПОВТОРИТЬ</button></div>
</div>

<div id="screen-downloaded" class="app-screen">
<div class="header-title-white"><h1>Загружено</h1></div>
<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M12 4v13m0 0l-6-6m6 6l6-6"/></svg></div><div class="empty-text">Файлов пока нет</div><button class="btn-search-empty" onclick="switchTab('search')"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><line x1="15" y1="15" x2="21" y2="21"/></svg>Поиск</button></div>
</div>

<div id="screen-settings" class="app-screen">
<div class="settings-header"><h1>Настройки</h1></div>
<div class="settings-section"><div class="settings-section-title">Общие</div><div class="settings-list"><div class="settings-item" onclick="showScreen('screen-settings-download')"><div class="settings-item-left"><svg class="settings-item-icon" viewBox="0 0 24 24"><path d="M12 4v9m0 0l-4-4m4 4l4-4M6 18h12"/></svg><span class="settings-item-text">Настройки загрузки</span></div><svg class="chevron-icon" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div></div></div>
</div>

<div id="screen-settings-download" class="app-screen">
<div class="header-title-white" style="display:flex;align-items:center;padding-top:30px"><button class="back-btn" onclick="showScreen('screen-settings')" style="background:none;border:none;margin-right:15px"><svg viewBox="0 0 24 24" style="width:24px;height:24px;stroke:#111;fill:none;stroke-width:2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><h1>Настройки загрузки</h1></div>
<div class="settings-list" style="margin-top:20px"><div class="settings-item"><div class="settings-item-left"><span class="settings-item-text">Папка для скачивания</span></div><span style="font-size:14px;color:#999">/download</span></div></div>
</div>

</div>
<script>
function switchTab(tabName) {
if(tabName === 'search') showScreen('screen-search');
if(tabName === 'youtube') showScreen('screen-youtube');
if(tabName === 'music') showScreen('screen-music');
}
function showScreen(screenId, btnElement) {
document.querySelectorAll('.app-screen').forEach(screen => screen.classList.remove('active'));
document.getElementById(screenId).classList.add('active');
if (btnElement) {
document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
btnElement.classList.add('active');
}
}
</script>
</body>
</html>
