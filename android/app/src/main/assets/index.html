<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* ЧИСТО БЕЛЫЙ ФОН */
        body {
            background-color: #ffffff;
            color: #333;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .screen { display: none; flex-direction: column; height: 100vh; position: relative; z-index: 1; }
        .screen.active { display: flex; }

        /* --- БЛЕДНЫЕ ПРОЗРАЧНЫЕ ИКОНКИ НА ФОНЕ --- */
        .bg-watermarks {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .wm-icon {
            position: absolute;
            fill: #f5f5f5; /* Очень бледный серый, почти прозрачный */
        }

        /* Симметричное расположение, как ты просил */
        .wm-youtube { width: 140px; height: 140px; top: 20%; left: 5%; transform: rotate(-15deg); }
        .wm-tiktok { width: 130px; height: 130px; top: 25%; right: 5%; transform: rotate(15deg); }
        
        .wm-whatsapp { width: 120px; height: 120px; top: 45%; left: 10%; transform: rotate(-5deg); }
        .wm-instagram { width: 130px; height: 130px; top: 50%; right: 10%; transform: rotate(20deg); }
        
        /* ВМЕСТО ДЖОЙСТИКА - НОТА */
        .wm-music { width: 160px; height: 160px; bottom: 15%; left: 30%; transform: rotate(-10deg); }

        /* --- ВЕРХНИЕ ВКЛАДКИ --- */
        .top-tabs {
            display: flex; justify-content: space-around;
            padding: 20px 10px 0 10px; font-size: 16px;
            color: #888; font-weight: bold;
        }
        .tab { padding-bottom: 10px; }
        .tab.active { color: #000; border-bottom: 3px solid #FFC107; }

        /* --- ЛОГОТИП И ПОИСК --- */
        .header-section { text-align: center; padding: 40px 20px; flex: 1; }
        .logo { font-size: 42px; font-weight: 900; color: #FFC107; margin-bottom: 35px; letter-spacing: -1px; }
        
        /* АБСОЛЮТНО ПУСТАЯ СТРОКА ПОИСКА */
        .search-box {
            display: flex; align-items: center;
            border: 1px solid #ccc; border-radius: 30px;
            padding: 18px 25px;
            margin: 0 auto; width: 95%; background: #fff;
        }
        .search-input { 
            width: 100%; border: none; outline: none; 
            font-size: 16px; color: #333; background: transparent; 
        }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-nav {
            display: flex; justify-content: space-around; padding: 12px 0;
            border-top: 1px solid #f0f0f0; background-color: #ffffff;
            z-index: 1;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #888; cursor: pointer; }
        .nav-item.active { color: #000; font-weight: bold; }
        .nav-icon { width: 24px; height: 24px; margin-bottom: 5px; fill: #888; }
        .nav-item.active .nav-icon { fill: #000; }
    </style>
</head>
