<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #ffffff;
            color: #333;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .screen { display: none; flex-direction: column; height: 100vh; position: relative; }
        .screen.active { display: flex; }

        /* --- ФОН С ВОДЯНЫМИ ЗНАКАМИ --- */
        .bg-watermarks {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.03;
            pointer-events: none;
            overflow: hidden;
        }
        .wm-icon { position: absolute; fill: #000; }
        .wm-1 { width: 120px; height: 120px; top: 10%; left: 5%; transform: rotate(-15deg); }
        .wm-2 { width: 100px; height: 100px; top: 15%; left: 50%; transform: rotate(10deg); }
        .wm-3 { width: 140px; height: 140px; top: 40%; left: 10%; transform: rotate(-5deg); }
        .wm-4 { width: 110px; height: 110px; top: 45%; left: 60%; transform: rotate(20deg); }
        .wm-5 { width: 130px; height: 130px; top: 70%; left: 20%; transform: rotate(-10deg); }

        /* --- ВЕРХНИЕ ВКЛАДКИ --- */
        .top-tabs {
            display: flex; justify-content: space-around;
            padding: 20px 10px 0 10px; font-size: 16px;
            color: #888; font-weight: bold; z-index: 1;
        }
        .tab { padding-bottom: 10px; }
        .tab.active { color: #000; border-bottom: 3px solid #FFC107; }

        /* --- ЛОГОТИП И ПОИСК --- */
        .header-section { text-align: center; padding: 40px 20px; z-index: 1; }
        .logo { font-size: 42px; font-weight: 900; color: #FFC107; margin-bottom: 40px; letter-spacing: -1px; }
        .search-box {
            display: flex; align-items: center;
            border: 1px solid #ccc; border-radius: 30px;
            padding: 5px; margin: 0 auto; width: 95%; background: #fff;
        }
        .search-icon-left { width: 24px; height: 24px; margin-left: 15px; fill: #888; }
        .search-input { flex: 1; border: none; outline: none; padding: 10px 15px; font-size: 16px; color: #666; background: transparent; }
        .search-button {
            background-color: #FFC107; border: none;
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .search-icon-right { width: 24px; height: 24px; fill: #000; }

        /* --- ЭКРАН НАСТРОЕК --- */
        .settings-content { flex: 1; z-index: 1; padding: 10px 20px; overflow-y: auto; }
        .settings-header { font-size: 26px; font-weight: bold; margin-bottom: 20px; margin-top: 10px; }
        .settings-group { font-size: 14px; color: #999; margin-top: 20px; margin-bottom: 10px; }
        
        .settings-item {
            display: flex; align-items: center; padding: 18px 0;
            border-bottom: 1px solid #f5f5f5; font-size: 16px; color: #333;
        }
        .settings-icon { width: 24px; height: 24px; fill: #888; margin-right: 15px; }
        .settings-value { margin-left: auto; color: #aaa; font-size: 14px; margin-right: 10px; }
        .arrow { color: #ccc; font-size: 20px; font-weight: bold; }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-nav {
            display: flex; justify-content: space-around; padding: 12px 0;
            border-top: 1px solid #f0f0f0; background-color: #ffffff; z-index: 1;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #888; cursor: pointer; }
        .nav-item.active { color: #000; font-weight: bold; }
        .nav-icon { width: 24px; height: 24px; margin-bottom: 5px; fill: #888; }
        .nav-item.active .nav-icon { fill: #000; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНЫЙ -->
    <div id="screen-main" class="screen active">
        <div class="bg-watermarks">
            <svg class="wm-icon wm-1" viewBox="0 0 24 24"><path d="M21.58 16.09l-1.09-7.66C20.21 6.46 18.52 5 16.53 5H7.47C5.48 5 3.79 6.46 3.51 8.43l-1.09 7.66C2.2 17.63 3.39 19 4.94 19c.68 0 1.32-.27 1.8-.75L9 16h6l2.25 2.25c.48.48 1.13.75 1.8.75 1.56 0 2.75-1.37 2.53-2.91zM11 11H9v2H8v-2H6v-1h2V8h1v2h2v1zm4-1c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
            <svg class="wm-icon wm-2" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            <svg class="wm-icon wm-3" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
            <svg class="wm-icon wm-4" viewBox="0 0 24 24"><path d="M12 2c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2zm0 2c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm-2 8c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm6 0c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm-6 4c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm-6 0c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2z"/></svg>
            <svg class="wm-icon wm-5" viewBox="0 0 24 24"><path d="M21.58 16.09l-1.09-7.66C20.21 6.46 18.52 5 16.53 5H7.47C5.48 5 3.79 6.46 3.51 8.43l-1.09 7.66C2.2 17.63 3.39 19 4.94 19c.68 0 1.32-.27 1.8-.75L9 16h6l2.25 2.25c.48.48 1.13.75 1.8.75 1.56 0 2.75-1.37 2.53-2.91zM11 11H9v2H8v-2H6v-1h2V8h1v2h2v1zm4-1c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        </div>

        <div class="top-tabs">
            <div class="tab active">Поиск</div>
            <div class="tab">YouTube</div>
            <div class="tab">Музыка</div>
            <div class="tab">Ещё</div>
        </div>

        <div class="header-section">
            <div class="logo">Snaptube</div>
            <div class="search-box">
                <svg class="search-icon-left" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <input type="text" class="search-input" placeholder="Поищи, что скачать...">
                <button class="search-button">
                    <svg class="search-icon-right" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: НАСТРОЙКИ -->
    <div id="screen-settings" class="screen">
        <div class="settings-content">
            <div class="settings-header">Настройки</div>
            
            <div class="settings-group">Общие</div>
            <div class="settings-item">
                <svg class="settings-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Настройки загрузки
                <span class="arrow">›</span>
            </div>
            <div class="settings-item">
                <svg class="settings-icon" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                Настройки уведомлений
                <span class="arrow">›</span>
            </div>
            <div class="settings-item">
                <svg class="settings-icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/></svg>
                Тема
                <span class="arrow">›</span>
            </div>

            <div class="settings-group">Информация</div>
            <div class="settings-item">
                <svg class="settings-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Уч. запись
                <span class="settings-value">Иван Сигуля</span>
                <span class="arrow">›</span>
            </div>
            <div class="settings-item">
                <svg class="settings-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
                Регион и язык
                <span class="arrow">›</span>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showScreen('screen-main', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <div>Загрузить</div>
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12zM8 6v8l6-4-6-4z"/></svg>
            <div>Воспроизведение</div>
        </div>
        <div class="nav-item" onclick="showScreen('screen-settings', this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
            <div>Настройки</div>
        </div>
    </div>

    <script>
        function showScreen(screenId, clickedElement) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            clickedElement.classList.add('active');
        }
    </script>
</body>
</html>
