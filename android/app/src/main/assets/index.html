<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snaptube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 30px 10px 30px; 
        }

        .tab {
            font-size: 17px;
            color: #999999;
            font-weight: 500;
            padding-bottom: 8px;
            position: relative;
        }

        .tab.active {
            color: #111111;
            font-weight: 700;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 35px;
            height: 3px;
            background-color: #ffcc00;
            border-radius: 2px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
        }

        .logo {
            font-size: 44px;
            font-weight: 800;
            color: #ffcc00;
            letter-spacing: -1.5px;
            margin-bottom: 45px;
        }

        .search-bar {
            width: 88%;
            height: 58px;
            border: 1px solid #b0b0b0;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 0 6px 0 16px;
        }

        .icon-download {
            color: #888888;
            font-size: 18px;
            margin-right: 12px;
            transform: translateY(1px);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 17px;
            color: #333333;
        }

        .search-input::placeholder {
            color: #999999;
            font-weight: 400;
        }

        .search-button {
            width: 46px;
            height: 46px;
            background-color: #ffcc00;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .search-button i {
            color: #111111;
            font-size: 20px;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px 30px 40px;
            border-top: 1px solid #f0f0f0;
            background-color: #ffffff;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #999999;
        }

        .nav-item i {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 500;
        }

        .nav-item.active {
            color: #111111;
        }
        
        .nav-item.active span {
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="tab active">Поиск</div>
        <div class="tab">YouTube</div>
        <div class="tab">Музыка</div>
    </div>

    <div class="main-content">
        <div class="logo">Snaptube</div>
        
        <div class="search-bar">
            <i class="fa-solid fa-arrow-down-to-line icon-download"></i>
            <input type="text" class="search-input" placeholder="Поиск">
            <button class="search-button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Загрузить</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-regular fa-circle-play"></i>
            <span>Воспроизведение</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Настройки</span>
        </a>
    </div>

</body>
</html>
