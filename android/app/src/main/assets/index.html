<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snaptube Clone</title>
<style>
    /* Идеальный шрифт (системный, как на Android/iOS) */
    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
    }

    /* Верхние табы */
    .top-tabs {
        display: flex;
        justify-content: space-around;
        padding: 15px 10px 5px;
        font-size: 16px;
        font-weight: 600;
        color: #888;
        z-index: 10;
    }
    .tab {
        padding-bottom: 8px;
        position: relative;
    }
    .tab.active {
        color: #000;
    }
    .tab.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background-color: #FFC107;
        border-radius: 2px;
    }

    /* Основной контент (Центрируем по вертикали) */
    .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; /* Это центрирует блок визуально */
        padding: 0 20px;
        padding-bottom: 12vh; /* Небольшой сдвиг вверх, чтобы освободить место для плашки уведомления */
        position: relative;
    }

    /* Логотип */
    .logo {
        color: #FFC107;
        font-size: 42px;
        font-weight: 800;
        margin-bottom: 50px;
        letter-spacing: -0.5px;
    }

    /* Строка поиска (БЕЗ желтой кнопки) */
    .search-bar {
        width: 100%;
        max-width: 350px;
        display: flex;
        align-items: center;
        border: 1px solid #D1D1D1;
        border-radius: 30px;
        padding: 14px 20px;
        box-sizing: border-box;
        background: #fff;
    }

    /* Еле заметная стрелочка */
    .search-icon-left {
        width: 20px;
        height: 20px;
        fill: #C0C0C0;
        margin-right: 15px;
        opacity: 0.7;
    }

    /* Поле ввода */
    .search-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 17px;
        color: #000;
        background: transparent;
    }

    /* Еле заметный текст "Поиск" */
    .search-input::placeholder {
        color: #B0B0B0;
        opacity: 0.8;
        font-weight: 400;
    }

    /* Всплывающее уведомление (Toast) */
    .toast {
        position: absolute;
        bottom: 90px;
        left: 15px;
        right: 15px;
        background: #ffffff;
        border-radius: 25px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        padding: 18px 20px;
        font-size: 15px;
        line-height: 1.4;
        color: #000;
        z-index: 10;
    }

    /* Нижнее меню с ИДЕАЛЬНЫМИ иконками */
    .bottom-nav {
        display: flex;
        justify-content: space-between;
        background: #fff;
        border-top: 1px solid #F0F0F0;
        padding: 10px 25px 20px;
        position: absolute;
        bottom: 0;
        width: 100%;
        box-sizing: border-box;
        z-index: 10;
    }

    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #888;
        font-size: 12px;
        gap: 6px;
        cursor: pointer;
    }

    .nav-item.active {
        color: #000;
        font-weight: 600;
    }

    .nav-item svg {
        width: 26px;
        height: 26px;
        fill: currentColor;
    }
    
    .nav-item.active svg {
        stroke-width: 2.5;
    }

</style>
</head>
<body>

    <!-- Верхние табы -->
    <div class="top-tabs">
        <div class="tab active">Поиск</div>
        <div class="tab">YouTube</div>
        <div class="tab">Музыка</div>
    </div>

    <!-- Основной контент -->
    <div class="content">
        <div class="logo">Snaptube</div>

        <!-- Строка поиска -->
        <div class="search-bar">
            <!-- Стрелочка вниз (еле заметная) -->
            <svg class="search-icon-left" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            
            <input type="text" class="search-input" placeholder="Поиск">
        </div>
    </div>

    <!-- Всплывающее уведомление -->
    <div class="toast">
        Приложение "Snaptube" вставило данные из буфера обмена.
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <!-- Активная вкладка "Загрузить" (Лупа) -->
        <div class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Загрузить</span>
        </div>
        
        <!-- Вкладка "Воспроизведение" -->
        <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
            </svg>
            <span>Воспроизведение</span>
        </div>
        
        <!-- Вкладка "Настройки" -->
        <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Настройки</span>
        </div>
    </div>

</body>
</html>
