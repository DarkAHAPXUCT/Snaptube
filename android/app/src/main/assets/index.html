<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snaptube UI</title>
    <style>
        /* Базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0; /* Фон вокруг телефона */
        }

        /* Контейнер мобильного экрана */
        .phone-mockup {
            width: 375px;
            height: 812px; /* Пропорции iPhone */
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 30px; /* Для красоты, если смотреть в браузере */
        }

        /* --- Декоративные фоновые пятна --- */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.3;
            filter: blur(20px);
        }
        .shape-1 { top: 50px; left: -20px; width: 120px; height: 120px; background-color: #E8E6FF; }
        .shape-2 { top: 70px; left: 120px; width: 130px; height: 130px; background-color: #FFEBF0; }
        .shape-3 { top: 60px; right: -20px; width: 150px; height: 150px; background-color: #FFF6D9; }
        .shape-4 { top: 220px; left: 20px; width: 180px; height: 100px; background-color: #E0F7FA; border-radius: 40px; }
        .shape-5 { top: 220px; right: 20px; width: 120px; height: 120px; background-color: #E0F2F1; }

        /* --- Верхние вкладки --- */
        .top-tabs {
            display: flex;
            padding: 30px 20px 10px 20px;
            position: relative;
            z-index: 1;
            gap: 15px;
        }

        .tab {
            font-size: 18px;
            font-weight: 600;
            color: #9E9E9E;
            cursor: pointer;
            position: relative;
            padding-bottom: 5px;
        }

        .tab.active {
            color: #1A1A1A;
        }

        /* Желтая полоска под активной вкладкой */
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #FFC900;
            border-radius: 2px;
        }

        /* --- Логотип --- */
        .logo-container {
            text-align: center;
            margin-top: 60px;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 46px;
            font-weight: 800;
            color: #FFC900;
            letter-spacing: -1px;
        }

        /* --- Строка поиска --- */
        .search-container {
            padding: 0 20px;
            margin-top: 50px;
            position: relative;
            z-index: 1;
        }

        .search-bar {
            display: flex;
            align-items: center;
            border: 1px solid #D1D1D1;
            border-radius: 30px;
            height: 60px;
            padding: 0 20px;
            background-color: #ffffff;
        }

        .search-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .search-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #999999;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-input {
            border: none;
            outline: none;
            font-size: 17px;
            color: #1A1A1A;
            width: 100%; /* Занимает все оставшееся место, так как кнопку убрали */
            background: transparent;
        }

        .search-input::placeholder {
            color: #999999;
        }

        /* --- Нижняя навигация --- */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 25px 0; /* Отступ снизу для полоски Home bar */
            border-top: 1px solid #F0F0F0;
            background-color: #ffffff;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .nav-item svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: #999999;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-item span {
            font-size: 12px;
            color: #999999;
        }

        /* Активное состояние нижней вкладки */
        .nav-item.active svg {
            stroke: #1A1A1A;
            stroke-width: 2.2;
        }

        .nav-item.active span {
            color: #1A1A1A;
            font-weight: 600;
        }

    </style>
</head>
<body>

    <div class="phone-mockup">
        
        <!-- Фоновые элементы -->
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
        <div class="bg-shape shape-4"></div>
        <div class="bg-shape shape-5"></div>

        <!-- Верхние табы -->
        <div class="top-tabs">
            <div class="tab active">Поиск</div>
            <div class="tab">YouTube</div>
            <div class="tab">Музыка</div>
        </div>

        <!-- Логотип -->
        <div class="logo-container">
            <div class="logo">Snaptube</div>
        </div>

        <!-- Поиск (без желтой кнопки) -->
        <div class="search-container">
            <div class="search-bar">
                <div class="search-icon">
                    <!-- Иконка скачивания (стрелка вниз) -->
                    <svg viewBox="0 0 24 24">
                        <path d="M12 4v12m0 0l-5-5m5 5l5-5M4 20h16" />
                    </svg>
                </div>
                <input type="text" class="search-input" placeholder="Поиск">
                <!-- Желтая кнопка удалена согласно заданию -->
            </div>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <!-- Иконка лупы -->
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
                <span>Загрузить</span>
            </div>
            
            <div class="nav-item">
                <!-- Иконка воспроизведения (стопка с плей) -->
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="5" width="14" height="14" rx="2" ry="2"></rect>
                    <path d="M8 10l4 2-4 2v-4z" fill="#999999" stroke="none"></path>
                    <path d="M7 2h13a2 2 0 0 1 2 2v13"></path>
                </svg>
                <span>Воспроизведение</span>
            </div>
            
            <div class="nav-item">
                <!-- Иконка шестеренки -->
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>Настройки</span>
            </div>
        </div>

    </div>

</body>
</html>
