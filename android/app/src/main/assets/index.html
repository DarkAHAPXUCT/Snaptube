<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* --- ВЕРХНИЕ ВКЛАДКИ --- */
        .top-tabs {
            display: flex; 
            justify-content: space-between;
            padding: 9vw 6vw 0 6vw; 
            font-size: 4.2vw;
            z-index: 1;
        }
        
        .tab { 
            padding-bottom: 2vw; 
            cursor: pointer;
            font-weight: 500;
            color: #888; 
        }
        
        .tab.active { 
            font-weight: bold;
            color: #000; 
            border-bottom: 0.8vw solid #FFC107; 
        }

        /* --- ЦЕНТРАЛЬНАЯ ЧАСТЬ --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            z-index: 1;
            padding: 0 5vw;
            padding-bottom: 15vw; 
        }

        .logo { 
            font-size: 11vw; 
            font-weight: 900; 
            color: #FFC107; 
            margin-bottom: 8vw; 
            letter-spacing: -0.2vw; 
        }
        
        /* --- СТРОКА ПОИСКА (БЕЗ ЖЕЛТОЙ КНОПКИ, СИММЕТРИЧНАЯ) --- */
        .search-box {
            display: flex; 
            align-items: center;
            border: 1px solid #dcdcdc; 
            border-radius: 8vw; 
            padding: 0 5vw; /* Симметричный отступ слева и справа */
            width: 95%; 
            background: #fff;
            height: 15vw; 
            cursor: text;
        }
        
        .search-icon-left { 
            width: 6vw; 
            height: 6vw; 
            margin-right: 4vw; 
            fill: none; 
            stroke: #888; 
            stroke-width: 0.5vw;
            flex-shrink: 0; 
        }
        
        .search-input { 
            flex: 1;
            height: 100%;
            border: none; 
            outline: none; 
            font-size: 4.5vw; 
            color: #666; 
            background: transparent; 
        }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-nav {
            display: flex; 
            justify-content: space-around; 
            padding: 3vw 0 8vw 0; 
            border-top: 1px solid #f0f0f0; 
            background-color: #ffffff;
            z-index: 10;
        }
        
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 3.5vw; 
            color: #888; 
            cursor: pointer; 
            font-weight: 500;
        }
        
        .nav-item.active { 
            font-weight: bold;
            color: #000; 
        }
        
        .nav-icon { 
            width: 7vw; 
            height: 7vw; 
            margin-bottom: 1.5vw; 
            fill: none; 
            stroke: #888; 
            stroke-width: 0.5vw;
        }
        
        .nav-item.active .nav-icon { 
            stroke: #000; 
        }
    </style>
</head>
<body>

    <!-- ВЕРХНИЕ ВКЛАДКИ -->
    <div class="top-tabs">
        <div class="tab active">Поиск</div>
        <div class="tab">YouTube</div>
        <div class="tab">Музыка</div>
    </div>

    <!-- ЦЕНТР -->
    <div class="main-content">
        <div class="logo">Snaptube</div>
        
        <!-- СТРОКА ПОИСКА (БЕЗ КНОПКИ) -->
        <div class="search-box" onclick="document.getElementById('search-input').focus();">
            <svg class="search-icon-left" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Поиск">
            <!-- Желтая кнопка удалена -->
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <div>Загрузить</div>
        </div>
        
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <rect x="6" y="4" width="16" height="16" rx="2" ry="2"></rect>
                <polygon points="11 9 15 12 11 15 11 9" fill="currentColor"></polygon>
                <line x1="2" y1="6" x2="2" y2="18"></line>
            </svg>
            <div>Воспроизведение</div>
        </div>
        
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <div>Настройки</div>
        </div>
    </div>

</body>
</html>
